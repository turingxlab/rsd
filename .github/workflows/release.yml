name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: 1.97.1

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cargo version matches tag
        shell: python
        run: |
          import os
          import sys
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]

          tag = os.environ["GITHUB_REF_NAME"]
          expected_tag = f"v{version}"
          if tag != expected_tag:
              print(f"::error::Release tag {tag} does not match Cargo.toml version {version}; expected {expected_tag}")
              sys.exit(1)

          print(f"Release tag {tag} matches Cargo.toml version {version}")

  build:
    name: Build ${{ matrix.target }}
    needs: validate-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            platform: darwin-arm64
            runner: macos-15
            binary: rsd
          - target: x86_64-apple-darwin
            platform: darwin-x86_64
            runner: macos-15
            binary: rsd
          - target: aarch64-pc-windows-msvc
            platform: windows-arm64
            runner: windows-11-arm
            binary: rsd.exe
          - target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            runner: windows-2022
            binary: rsd.exe
          - target: aarch64-unknown-linux-musl
            platform: linux-arm64
            runner: ubuntu-24.04-arm
            binary: rsd
          - target: x86_64-unknown-linux-musl
            platform: linux-x86_64
            runner: ubuntu-24.04
            binary: rsd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        if: endsWith(matrix.target, '-unknown-linux-musl')
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        if: endsWith(matrix.target, '-unknown-linux-musl')
        shell: bash
        run: cargo install cargo-zigbuild --version 0.20.1 --locked

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.target }}" == *-unknown-linux-musl ]]; then
            RUSTFLAGS="-C target-feature=+crt-static" cargo zigbuild --release --target "${{ matrix.target }}"
          elif [[ "${{ matrix.target }}" == *-pc-windows-msvc ]]; then
            RUSTFLAGS="-C target-feature=+crt-static" cargo build --release --target "${{ matrix.target }}"
          else
            MACOSX_DEPLOYMENT_TARGET=14.0 cargo build --release --target "${{ matrix.target }}"
          fi

      - name: Verify Linux binary is statically linked
        if: endsWith(matrix.target, '-unknown-linux-musl')
        shell: bash
        run: |
          set -euo pipefail
          file "target/${{ matrix.target }}/release/rsd"
          readelf -lW "target/${{ matrix.target }}/release/rsd" > program-headers.txt
          readelf -dW "target/${{ matrix.target }}/release/rsd" > dynamic-section.txt
          if grep -q 'INTERP' program-headers.txt || grep -q '(NEEDED)' dynamic-section.txt; then
            echo "Linux binary is dynamically linked" >&2
            exit 1
          fi

      - name: Verify Linux startup on older Ubuntu releases
        if: endsWith(matrix.target, '-unknown-linux-musl')
        shell: bash
        run: |
          set -euo pipefail
          for version in 16.04 18.04; do
            docker run --rm \
              -v "$PWD/target/${{ matrix.target }}/release/rsd:/rsd:ro" \
              "ubuntu:${version}" /rsd --version
          done

      - name: Verify Windows startup
        if: endsWith(matrix.target, '-pc-windows-msvc')
        shell: bash
        run: '"target/${{ matrix.target }}/release/rsd.exe" --version'

      - name: Package archives
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          BINARY: ${{ matrix.binary }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_dir="rsd-${VERSION}-${PLATFORM}"
          mkdir -p "${package_dir}"
          cp "target/${TARGET}/release/${BINARY}" "${package_dir}/"
          cp "target/${TARGET}/release/rsd.toml" "${package_dir}/"
          cp LICENSE "${package_dir}/"
          tar -czf "${package_dir}.tar.gz" "${package_dir}"
          if [[ "${TARGET}" == *-pc-windows-msvc ]]; then
            if command -v zip >/dev/null 2>&1; then
              zip -qr "${package_dir}.zip" "${package_dir}"
            else
              7z a -tzip "${package_dir}.zip" "${package_dir}" >/dev/null
            fi
          fi

      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: archives-${{ matrix.target }}
          path: |
            rsd-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz
            rsd-${{ github.ref_name }}-${{ matrix.platform }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: archives-*
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: rsd ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*

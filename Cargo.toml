[package]
name = "rsd"
description = "A cross-platform daemon for remote devices."
version = "0.2.1"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.5", features = ["json", "stream", "multipart"] }
thiserror = "2.0.20"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "local-time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
url = "2.5.8"
futures-util = "0.3.34"
time = "0.3.55"
dirs = "7.0.0"
self_update = { version = "1.3.3", default-features = false, features = ["reqwest", "rustls", "checksums"] }
png = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-screen-capture-kit = "0.3"

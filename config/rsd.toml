[server]
addr = "127.0.0.1"
port = 8080
tls = false

[http]
# API path prefix for screenshot and log uploads
path = "/device/rsd"

[websocket]
path = "/ws/rsd/cmd"
reconnect_interval_sec = 30
heartbeat_enabled = true
heartbeat_interval_sec = 30

[logging]
level = "info"
# console (default) or file
# output = "file"
# File logs default to .rsd/logs under the user's home directory; override below
# Relative paths are based on the process working directory
# directory = "logs"
# never (default), minutely, hourly, daily, or weekly; rotation uses UTC
# rotation = "daily"
# Maximum number of retained log files; omit to disable automatic cleanup
# max_log_files = 7
